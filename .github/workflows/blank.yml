name: Сборка приложения для ТВ

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: ''

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Собрать APK
        run: gradle --no-daemon assembleDebug

      - name: Подготовить файл
        run: cp app/build/outputs/apk/debug/app-debug.apk na-kryishe-tv.apk

      - name: Сохранить как файл сборки
        uses: actions/upload-artifact@v4
        with:
          name: na-kryishe-tv
          path: na-kryishe-tv.apk

      - name: Выложить по постоянной ссылке
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest na-kryishe-tv.apk --title "Последняя сборка" --notes "Приложение для ТВ-приставки «На Крыше»" --latest
