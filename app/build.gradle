plugins {
    id 'com.android.application'
}

android {
    namespace 'club.nakryshe.tv'
    compileSdk 34

    defaultConfig {
        applicationId 'club.nakryshe.tv'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        // Ставим файлом на приставку, не через Google Play, поэтому хватает debug-сборки: она подписывается автоматически.
        debug {
            debuggable false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
