plugins {
    id 'com.android.application'
}

android {
    namespace 'club.nakryshe.tv'
    compileSdk 34

    defaultConfig {
        applicationId 'club.nakryshe.tv'
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }

    signingConfigs {
        // Постоянный ключ подписи (файл debug.keystore лежит рядом). Без него каждая сборка на GitHub получает новый ключ,
        // и Android не даёт поставить новую версию поверх установленной: настройки приходится вводить заново.
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        // Ставим файлом на приставку, не через Google Play, поэтому хватает debug-сборки с постоянным ключом выше.
        debug {
            debuggable false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
